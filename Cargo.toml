[package]
name = "normalmapai-url-tools"
version = "0.1.0"
edition = "2021"
description = "Free normal map generator by NormalMapAI. Convert any photo into a normal map with live 3D preview — plus height, roughness, AO and more. Private in-browser; export for Unity, Unreal, Godot and Blender."
license = "MIT"
homepage = "https://normalmapai.com/"
repository = "https://github.com/wangneo276-lgtm/normalmapai-url-tools"
readme = "README.md"
keywords = ["normal-map", "pbr", "url"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]

[lib]
name = "normalmapai_url_tools"
path = "src/lib.rs"
